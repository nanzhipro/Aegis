name: Privileged Smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to download and verify on the privileged runner.
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on:
      - self-hosted
      - macOS
      - aegis-privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 when available
        run: |
          if [ -d /Applications/Xcode_15.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi

      - name: Verify controlled macOS 14 or newer host
        run: |
          version="$(sw_vers -productVersion)"
          major_version="${version%%.*}"
          if [ "$major_version" -lt 14 ]; then
            echo "Expected a controlled macOS 14 or newer runner."
            exit 1
          fi

      - name: Bootstrap toolchain checks
        run: ./scripts/bootstrap.sh

      - name: Download release DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.release_tag }}" --pattern 'AegisApp.dmg' --dir build/release --clobber

      - name: Extract app from DMG for local validation
        run: |
          mount_output=$(hdiutil attach build/release/AegisApp.dmg -nobrowse -readonly)
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// { print substr($0, index($0, "/Volumes/")); exit }')
          mkdir -p build/release/SmokeApp
          ditto "$mount_point/AegisApp.app" build/release/SmokeApp/AegisApp.app
          hdiutil detach "$mount_point"

      - name: Validate downloaded release artifacts
        env:
          AEGIS_EXPORTED_APP_PATH: ${{ github.workspace }}/build/release/SmokeApp/AegisApp.app
        run: ./scripts/validate-release.sh

      - name: Emit manual privileged smoke checklist
        run: |
          echo "Manual smoke checklist:"
          cat docs/release/privileged-smoke-checklist.md
          echo
          echo "Record template:"
          cat docs/release/privileged-smoke-record-template.md

      - name: Upload smoke documentation templates
        uses: actions/upload-artifact@v4
        with:
          name: aegis-privileged-smoke-docs
          path: |
            docs/release/privileged-smoke-checklist.md
            docs/release/privileged-smoke-record-template.md
            docs/release/readiness-checklist.md
          if-no-files-found: error
